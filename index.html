<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal del Alumno - CECYTEQ</title>
    <!-- Enlace a tu hoja de estilos externa -->
    <link rel="stylesheet" href="style.css">
    <!-- Librería QRious -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    
    <!-- SDKs de Firebase y configuración -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCB200wB3r9uFyOT_KlXkgCpRWMuu70zaA",
            authDomain: "cecyteq-eduqr.firebaseapp.com",
            projectId: "cecyteq-eduqr",
            storageBucket: "cecyteq-eduqr.firebasestorage.app",
            messagingSenderId: "112440689760",
            appId: "1:112440689760:web:af2965374a428f1166af05",
            measurementId: "G-5JJDH57SZF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
    </script>
</head>
<body>

    <div class="container-card">
        
        <div class="header-title">
            <img src="logo.png" alt="Logo pe-causa EDUQR" class="logo-marca">
            <h2>Portal del Alumno</h2>
            <p>Selecciona tus datos para generar tu código QR o consultar tu avance</p>
        </div>

        <!-- Selección de Grupo -->
        <div class="form-group">
            <label for="grupo">Selecciona tu Grupo:</label>
            <select id="grupo" class="select-control" onchange="actualizarListas()">
                <option value="">-- Selecciona tu grupo --</option>
                <option value="4TPROG-AM">4TPROG-AM</option>
                <option value="4TPROG-BM">4TPROG-BM</option>
            </select>
        </div>

        <!-- Selección de Parcial -->
        <div class="form-group">
            <label for="parcial">Selecciona el Parcial:</label>
            <select id="parcial" class="select-control" onchange="limpiarQR()">
                <option value="">-- Selecciona el parcial --</option>
                <option value="1er Parcial">1er Parcial</option>
                <option value="2do Parcial">2do Parcial</option>
                <option value="3er Parcial">3er Parcial</option>
            </select>
        </div>

        <!-- Selección de Alumno -->
        <div class="form-group">
            <label for="alumno">Selecciona tu Nombre:</label>
            <select id="alumno" class="select-control" disabled onchange="limpiarQR()">
                <option value="">-- Primero selecciona un grupo --</option>
            </select>
        </div>

        <!-- Selección de Actividad -->
        <div class="form-group">
            <label for="actividad">Selecciona la Actividad / Tarea:</label>
            <select id="actividad" class="select-control" disabled onchange="limpiarQR()">
                <option value="">-- Primero selecciona un grupo --</option>
            </select>
        </div>

        <button class="btn-qr" onclick="generarCodigoQR()">⚡ Generar Código QR</button>

        <!-- Botones inferiores -->
        <div class="action-buttons-container">
            <button class="btn-secondary-action" onclick="verResumenAlumno()">
                <span>📊</span> Ver Resumen
            </button>
            <button class="btn-ai-action" onclick="mostrarMantenimientoIA()">
                <span>🤖</span> Utilizar IA
            </button>
        </div>

        <div id="qrcode-container">
            <div id="loading-spinner" class="loading-text" style="display: none;">Generando código QR... ⏳</div>
            <div id="qrcode-box">
                <canvas id="qr-code"></canvas>
            </div>
            <p id="qr-info" style="font-size: 12px; color: #666; margin-top: 8px; font-weight: bold; text-align: center;"></p>
        </div>

    </div>

    <!-- Enlace al archivo de lógica externo con módulo -->
    <script type="module" src="script.js"></script>
</body>
</html>
